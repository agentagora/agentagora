name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref to conserve minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + lint + test (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency vulnerability scan. `--audit-level=moderate` ignores
      # low-severity advisories that are typically dev-only or noisy.
      # Bump to `high` once the dep tree is stable enough to expect
      # zero moderates.
      - name: Audit dependencies (pnpm audit)
        run: pnpm audit --audit-level=moderate --prod
        continue-on-error: true

      # Build first: package.json `types` fields point at dist/index.d.ts,
      # so cloud-api / examples can't typecheck until protocol + sdk emit
      # their declarations. (Locally this is hidden because a previous
      # build leaves dist/ on disk.)
      - name: Build all packages
        run: pnpm build

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test all packages
        run: pnpm test

      # Coverage gate (M3 §D). Per-package thresholds live in each
      # package's vitest.config.ts and were locked ~5pp below the
      # measured baseline so small refactors don't flap CI. vitest
      # will exit non-zero if any threshold drops.
      #
      # Gated packages: @agentagora/protocol, @agentagora/sdk,
      # @agentagora/cloud-api. apps/status and apps/cloud/dashboard
      # are intentionally excluded — they have no meaningful test
      # coverage yet and would only add noise.
      - name: Test coverage (gated)
        run: pnpm -r test --coverage --coverage.reporter=text-summary

      # Bundle-size budget — guards the "must run on Cloudflare Workers"
      # constraint in docs/tech-stack.md §8 principle #1. The worker-agent
      # example bundles the whole SDK; if the SDK accidentally pulls in a
      # Node-only dep or grows unbounded, this step fails before merge.
      - name: Bundle-size guard (worker-agent)
        run: pnpm --filter "@agentagora/example-worker-agent" check

      - name: Enforce bundle-size budget (≤ 250 KiB raw, ≤ 60 KiB gzip)
        env:
          BUNDLE_RAW_LIMIT_KIB: 250
          BUNDLE_GZIP_LIMIT_KIB: 60
        run: |
          set -euo pipefail
          BUNDLE=apps/examples/worker-agent/.wrangler/dry-run/index.js
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected bundle at $BUNDLE — wrangler dry-run did not produce it"
            ls -la apps/examples/worker-agent/.wrangler/dry-run/ || true
            exit 1
          fi
          RAW_BYTES=$(wc -c < "$BUNDLE")
          GZIP_BYTES=$(gzip -c "$BUNDLE" | wc -c)
          RAW_KIB=$(( (RAW_BYTES + 1023) / 1024 ))
          GZIP_KIB=$(( (GZIP_BYTES + 1023) / 1024 ))
          echo "Worker bundle: ${RAW_KIB} KiB raw, ${GZIP_KIB} KiB gzipped"
          if [ "$RAW_KIB" -gt "$BUNDLE_RAW_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${RAW_KIB} KiB exceeds raw budget ${BUNDLE_RAW_LIMIT_KIB} KiB"
            exit 1
          fi
          if [ "$GZIP_KIB" -gt "$BUNDLE_GZIP_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${GZIP_KIB} KiB gzipped exceeds budget ${BUNDLE_GZIP_LIMIT_KIB} KiB"
            exit 1
          fi
          echo "::notice::Bundle within budget (${RAW_KIB}/${BUNDLE_RAW_LIMIT_KIB} KiB raw, ${GZIP_KIB}/${BUNDLE_GZIP_LIMIT_KIB} KiB gzip)"

      # Bundle-size budget — cloud-api Worker. Same Workers-only constraint
      # as worker-agent, but cloud-api carries D1, KV, Stripe, OIDC, audit,
      # and disputes wiring. Budget is set above the M2-closed-alpha steady
      # state (281 KiB raw / 61 KiB gzip) with headroom for M3 dashboard
      # server actions and Stripe charge handling.
      #
      # security-review-2026-05 §M1: the real wrangler.jsonc carries
      # production D1 / KV resource IDs and is gitignored. CI stages
      # the committed example with REPLACE_BEFORE_DEPLOY placeholders;
      # `wrangler deploy --dry-run` doesn't validate binding IDs against
      # Cloudflare, so the placeholders are fine for bundle-size sizing.
      - name: Stage wrangler.jsonc for cloud-api dry-run
        run: cp apps/cloud/api/wrangler.jsonc.example apps/cloud/api/wrangler.jsonc

      - name: Bundle-size guard (cloud-api)
        run: pnpm --filter "@agentagora/cloud-api" check

      - name: Enforce bundle-size budget (≤ 320 KiB raw, ≤ 75 KiB gzip)
        env:
          CLOUD_API_RAW_LIMIT_KIB: 320
          CLOUD_API_GZIP_LIMIT_KIB: 75
        run: |
          set -euo pipefail
          BUNDLE=apps/cloud/api/.wrangler/dry-run/index.js
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected bundle at $BUNDLE — wrangler dry-run did not produce it"
            ls -la apps/cloud/api/.wrangler/dry-run/ || true
            exit 1
          fi
          RAW_BYTES=$(wc -c < "$BUNDLE")
          GZIP_BYTES=$(gzip -c "$BUNDLE" | wc -c)
          RAW_KIB=$(( (RAW_BYTES + 1023) / 1024 ))
          GZIP_KIB=$(( (GZIP_BYTES + 1023) / 1024 ))
          echo "Worker bundle: ${RAW_KIB} KiB raw, ${GZIP_KIB} KiB gzipped"
          if [ "$RAW_KIB" -gt "$CLOUD_API_RAW_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${RAW_KIB} KiB exceeds raw budget ${CLOUD_API_RAW_LIMIT_KIB} KiB"
            exit 1
          fi
          if [ "$GZIP_KIB" -gt "$CLOUD_API_GZIP_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${GZIP_KIB} KiB gzipped exceeds budget ${CLOUD_API_GZIP_LIMIT_KIB} KiB"
            exit 1
          fi
          echo "::notice::Bundle within budget (${RAW_KIB}/${CLOUD_API_RAW_LIMIT_KIB} KiB raw, ${GZIP_KIB}/${CLOUD_API_GZIP_LIMIT_KIB} KiB gzip)"

  # M3 §A.5 — synthetic latency benchmark for the cloud-api control
  # plane. Spins up `wrangler dev`, hammers the read-path routes with
  # ~100 sequential GETs each (after a 10-request warm-up), and fails
  # if median or p95 overhead exceeds the PRD §9.3 #4 acceptance
  # criterion (200 ms p95).
  #
  # Marked `continue-on-error: true` for now — informational while we
  # establish a baseline. Promote to required after 2 weeks of green
  # runs.
  latency-bench:
    name: latency benchmark (cloud-api)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 10
    continue-on-error: true
    env:
      LATENCY_P50_MS_LIMIT: 100
      LATENCY_P95_MS_LIMIT: 200
      BENCH_BASE_URL: http://127.0.0.1:8787

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # security-review-2026-05 §M1: real wrangler.jsonc is gitignored;
      # stage the example for `wrangler dev` to read. Same rationale as
      # the bundle-size guard above — local SQLite + KV state is fine
      # for the synthetic bench.
      - name: Stage wrangler.jsonc for cloud-api
        run: cp apps/cloud/api/wrangler.jsonc.example apps/cloud/api/wrangler.jsonc

      - name: Start cloud-api (wrangler dev) in the background
        run: |
          set -euo pipefail
          mkdir -p .bench-logs
          # `wrangler dev` defaults to 127.0.0.1:8787. We pin --ip and
          # --port explicitly so the URL is stable even if wrangler
          # changes its defaults.
          nohup pnpm --filter @agentagora/cloud-api dev -- \
            --ip 127.0.0.1 --port 8787 \
            > .bench-logs/wrangler.log 2>&1 &
          echo $! > .bench-logs/wrangler.pid
          echo "wrangler dev pid=$(cat .bench-logs/wrangler.pid)"

      - name: Wait for /healthz to respond (timeout 30s)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 30))
          until curl -fsS "$BENCH_BASE_URL/healthz" >/dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::wrangler dev failed to respond on $BENCH_BASE_URL/healthz within 30s"
              echo "----- wrangler.log (tail) -----"
              tail -n 200 .bench-logs/wrangler.log || true
              # Best-effort cleanup so the runner can finalize.
              if [ -f .bench-logs/wrangler.pid ]; then
                kill -TERM "$(cat .bench-logs/wrangler.pid)" 2>/dev/null || true
              fi
              exit 1
            fi
            sleep 1
          done
          echo "cloud-api is up at $BENCH_BASE_URL"

      - name: Run latency benchmark
        id: bench
        run: pnpm --filter @agentagora/cloud-api bench

      - name: Upload bench results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-api-latency-bench
          path: apps/cloud/api/bench/results.json
          if-no-files-found: warn

      - name: Stop wrangler dev
        if: always()
        run: |
          if [ -f .bench-logs/wrangler.pid ]; then
            pid=$(cat .bench-logs/wrangler.pid)
            echo "stopping wrangler dev pid=$pid"
            kill -TERM "$pid" 2>/dev/null || true
            # Give it 5s to exit gracefully, then force.
            for _ in 1 2 3 4 5; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            kill -KILL "$pid" 2>/dev/null || true
          fi

      - name: Append wrangler log to step summary on failure
        if: failure()
        run: |
          {
            echo "## wrangler dev log (tail)"
            echo '```'
            tail -n 200 .bench-logs/wrangler.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
