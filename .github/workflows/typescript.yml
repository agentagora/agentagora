name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref to conserve minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + lint + test (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency vulnerability scan. We always show the audit report
      # in logs but emit a `::warning::` annotation rather than failing
      # the step on findings — the alternative was `continue-on-error:
      # true`, which still leaves a noisy red "Process completed with
      # exit code 1" annotation in the run summary even though the job
      # is allowed to continue.
      #
      # Today's known findings: 3 highs (Next 14.x → 15.5.15+, Astro
      # 4.x → 5.15.8+) tracked as deferred upgrade work in
      # docs/maintainer-tasks.md (M.15 / M.16). Once those upgrades
      # land, drop the `--audit-level=high` floor back to `moderate`
      # and convert the warning into a hard error so the gate has
      # teeth again.
      - name: Audit dependencies (pnpm audit)
        run: |
          set +e
          pnpm audit --audit-level=high --prod
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::pnpm audit found high-severity vulnerabilities — see logs above. Tracked as deferred upgrade work in docs/maintainer-tasks.md (M.15 Next 15, M.16 Astro 5)."
          fi
          exit 0

      # Build first: package.json `types` fields point at dist/index.d.ts,
      # so cloud-api / examples can't typecheck until protocol + sdk emit
      # their declarations. (Locally this is hidden because a previous
      # build leaves dist/ on disk.)
      - name: Build all packages
        run: pnpm build

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test all packages
        run: pnpm test

      # Coverage gate (M3 §D). Per-package thresholds live in each
      # package's vitest.config.ts and were locked ~5pp below the
      # measured baseline so small refactors don't flap CI. vitest
      # will exit non-zero if any threshold drops.
      #
      # Gated packages: @agentagora/protocol, @agentagora/sdk,
      # @agentagora/cloud-api. apps/status and apps/cloud/dashboard
      # are intentionally excluded — they have no meaningful test
      # coverage yet and would only add noise.
      - name: Test coverage (gated)
        run: pnpm -r test --coverage --coverage.reporter=text-summary

      # Bundle-size budget — guards the "must run on Cloudflare Workers"
      # constraint in docs/tech-stack.md §8 principle #1. The worker-agent
      # example bundles the whole SDK; if the SDK accidentally pulls in a
      # Node-only dep or grows unbounded, this step fails before merge.
      - name: Bundle-size guard (worker-agent)
        run: pnpm --filter "@agentagora/example-worker-agent" check

      - name: Enforce bundle-size budget (≤ 250 KiB raw, ≤ 60 KiB gzip)
        env:
          BUNDLE_RAW_LIMIT_KIB: 250
          BUNDLE_GZIP_LIMIT_KIB: 60
        run: |
          set -euo pipefail
          BUNDLE=apps/examples/worker-agent/.wrangler/dry-run/index.js
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected bundle at $BUNDLE — wrangler dry-run did not produce it"
            ls -la apps/examples/worker-agent/.wrangler/dry-run/ || true
            exit 1
          fi
          RAW_BYTES=$(wc -c < "$BUNDLE")
          GZIP_BYTES=$(gzip -c "$BUNDLE" | wc -c)
          RAW_KIB=$(( (RAW_BYTES + 1023) / 1024 ))
          GZIP_KIB=$(( (GZIP_BYTES + 1023) / 1024 ))
          echo "Worker bundle: ${RAW_KIB} KiB raw, ${GZIP_KIB} KiB gzipped"
          if [ "$RAW_KIB" -gt "$BUNDLE_RAW_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${RAW_KIB} KiB exceeds raw budget ${BUNDLE_RAW_LIMIT_KIB} KiB"
            exit 1
          fi
          if [ "$GZIP_KIB" -gt "$BUNDLE_GZIP_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${GZIP_KIB} KiB gzipped exceeds budget ${BUNDLE_GZIP_LIMIT_KIB} KiB"
            exit 1
          fi
          echo "::notice::Bundle within budget (${RAW_KIB}/${BUNDLE_RAW_LIMIT_KIB} KiB raw, ${GZIP_KIB}/${BUNDLE_GZIP_LIMIT_KIB} KiB gzip)"

      # Bundle-size budget — cloud-api Worker. Same Workers-only constraint
      # as worker-agent, but cloud-api carries D1, KV, Stripe, OIDC, audit,
      # disputes wiring, plus the security-review-2026-05-07 hardening
      # pack (Hono cors + bodyLimit middleware, KV fail-closed checks,
      # auth-before-503 fallback). The budget was originally set at
      # 320 KiB raw / 75 KiB gzip above the M2 steady state of 281/61.
      # Sustained security additions through M7+M9+M10+M11+L4 pushed
      # the bundle to ~322 KiB raw, so the budget moves to 340/75 —
      # still 5.5% headroom over current measured size, still tight
      # enough to catch an accidental Node-only mega-dep (`crypto`,
      # `stream`, `fs`) sneaking into the SDK.
      #
      # security-review-2026-05 §M1: the real wrangler.jsonc carries
      # production D1 / KV resource IDs and is gitignored. CI stages
      # the committed example with REPLACE_BEFORE_DEPLOY placeholders;
      # `wrangler deploy --dry-run` doesn't validate binding IDs against
      # Cloudflare, so the placeholders are fine for bundle-size sizing.
      - name: Stage wrangler.jsonc for cloud-api dry-run
        run: cp apps/cloud/api/wrangler.jsonc.example apps/cloud/api/wrangler.jsonc

      - name: Bundle-size guard (cloud-api)
        run: pnpm --filter "@agentagora/cloud-api" check

      - name: Enforce bundle-size budget (≤ 340 KiB raw, ≤ 75 KiB gzip)
        env:
          CLOUD_API_RAW_LIMIT_KIB: 340
          CLOUD_API_GZIP_LIMIT_KIB: 75
        run: |
          set -euo pipefail
          BUNDLE=apps/cloud/api/.wrangler/dry-run/index.js
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected bundle at $BUNDLE — wrangler dry-run did not produce it"
            ls -la apps/cloud/api/.wrangler/dry-run/ || true
            exit 1
          fi
          RAW_BYTES=$(wc -c < "$BUNDLE")
          GZIP_BYTES=$(gzip -c "$BUNDLE" | wc -c)
          RAW_KIB=$(( (RAW_BYTES + 1023) / 1024 ))
          GZIP_KIB=$(( (GZIP_BYTES + 1023) / 1024 ))
          echo "Worker bundle: ${RAW_KIB} KiB raw, ${GZIP_KIB} KiB gzipped"
          if [ "$RAW_KIB" -gt "$CLOUD_API_RAW_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${RAW_KIB} KiB exceeds raw budget ${CLOUD_API_RAW_LIMIT_KIB} KiB"
            exit 1
          fi
          if [ "$GZIP_KIB" -gt "$CLOUD_API_GZIP_LIMIT_KIB" ]; then
            echo "::error::Worker bundle ${GZIP_KIB} KiB gzipped exceeds budget ${CLOUD_API_GZIP_LIMIT_KIB} KiB"
            exit 1
          fi
          echo "::notice::Bundle within budget (${RAW_KIB}/${CLOUD_API_RAW_LIMIT_KIB} KiB raw, ${GZIP_KIB}/${CLOUD_API_GZIP_LIMIT_KIB} KiB gzip)"

  # M3 §A.5 — synthetic latency benchmark for the cloud-api control
  # plane. Currently DISABLED in CI — the job spins up `wrangler dev`
  # and waits for it via `nohup ... &`, but the GitHub Actions runner
  # waits for *all* descendant processes of the step's shell to exit
  # before marking it complete. Backgrounding alone doesn't detach
  # cleanly (likely because pnpm/wrangler keep some fd open), so the
  # step hangs to the job timeout on every run, costing 10-15 min of
  # CI budget for zero useful baseline data.
  #
  # The bench is informational — `continue-on-error: true` means it
  # never blocks merges. We re-enable it when promoting to a required
  # gate (M.12 in docs/maintainer-tasks.md). At that point we'll
  # either:
  #   (a) replace `nohup ... &` with `setsid -f` + full stdin/stdout
  #       redirect to fully detach wrangler dev from the runner, or
  #   (b) skip wrangler dev entirely and use `vite-node` to host the
  #       cloud-api Hono app on a vanilla Node HTTP server for the
  #       bench, eliminating the wrangler-in-CI fragility.
  #
  # The bench script itself (apps/cloud/api/bench/bench.ts) still runs
  # locally — `pnpm --filter @agentagora/cloud-api bench` against a
  # `wrangler dev` you've started in another terminal.
  #
  # latency-bench:
  #   name: latency benchmark (cloud-api)
  #   runs-on: ubuntu-latest
  #   needs: build-test-lint
  #   timeout-minutes: 15
  #   continue-on-error: true
  #   env:
  #     LATENCY_P50_MS_LIMIT: 100
  #     LATENCY_P95_MS_LIMIT: 200
  #     BENCH_BASE_URL: http://127.0.0.1:8787
  #     BENCH_ITERATIONS: 25
  #
  # The full step block (checkout / setup-node / install / stage
  # wrangler.jsonc / start wrangler dev / wait for healthz / run bench
  # / upload artifact / stop wrangler / append log on failure) lives
  # in commit 9d64648 — restore it from there when re-enabling.
