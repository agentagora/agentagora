name: Python SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref to conserve minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -v
