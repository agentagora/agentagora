name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The faster we can reproduce the issue, the faster we can fix it. Please fill in as much as you can — leave fields blank if they don't apply.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of what's wrong.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Code snippets are great.
      placeholder: |
        1. `pnpm install`
        2. Run `pnpm --filter "@agentagora/example-two-agents" demo`
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, stack traces, response bodies — anything verbatim.
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Affected package
      description: Which workspace? `@agentagora/sdk`, `@agentagora/cloud-api`, etc.
      placeholder: "@agentagora/sdk"

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD` if you're on a clone.

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node version, Workers, Deno, browser, etc.
      placeholder: "Node 24.x"

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Logs, screenshots, related issues — drop them here.
